name: Auto Sync Upstream Release with Patches

on:
  schedule:
    # Run every 6 hours to check for new upstream releases/tags
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific upstream tag to sync against (leave empty for latest release)'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  pull_requests: write

jobs:
  check-and-sync:
    name: Sync Upstream Release & Apply Patches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream Tags
        run: |
          git remote add upstream https://github.com/omnigent-ai/omnigent.git || true
          git fetch upstream --tags

      - name: Determine Target Release Tag
        id: release
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.target_tag }}" ]; then
            TARGET_TAG="${{ github.event.inputs.target_tag }}"
          else
            # Query the latest release tag from upstream
            TARGET_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          fi
          echo "Target tag is: ${TARGET_TAG}"
          echo "tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"

          # Check what base version we currently have
          CURRENT_BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Current base is: ${CURRENT_BASE}"
          echo "current_base=${CURRENT_BASE}" >> "$GITHUB_OUTPUT"

      - name: Attempt Automatic Patch & Rebase
        id: patch
        run: |
          set -euo pipefail
          TARGET_TAG="${{ steps.release.outputs.tag }}"
          SYNC_BRANCH="sync-${TARGET_TAG}-admin-hosts"

          echo "Checking out ${TARGET_TAG}..."
          git checkout -B "${SYNC_BRANCH}" "${TARGET_TAG}"

          # Apply our admin host sharing patches
          echo "Applying admin host sharing patches..."
          if git apply patches/0001-feat-hosts-admin-role-gets-access-to-all-shared-host.patch && \
             git apply patches/0002-fix-server-wire-permission_store-into-app.state.patch; then
            echo "Patches applied cleanly!"
            git add .
            git commit -m "feat(hosts): apply admin host sharing patches on top of ${TARGET_TAG}"

            # Copy over workflows & patch files
            git checkout main -- .github/workflows/ patches/
            git add .github/workflows/ patches/
            git commit -m "ci: keep sync and build workflows for ${TARGET_TAG}"

            # Merge / push to main if this is a new release
            git checkout main
            git merge --ff-only "${SYNC_BRANCH}" || git reset --hard "${SYNC_BRANCH}"
            git push origin main --force
            echo "sync_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "Conflict detected when applying patches to ${TARGET_TAG}!"
            git checkout -f
            echo "sync_status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Issue on Conflict
        if: steps.patch.outputs.sync_status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.release.outputs.tag }}';
            const title = `⚠️ Auto-sync conflict on new upstream release ${tag}`;
            const body = `Automated sync detected a new upstream release **${tag}**, but the admin host sharing patches could not be applied cleanly due to merge/patch conflicts.\n\nPlease inspect upstream changes and update the patches in \`patches/\`.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
            });
