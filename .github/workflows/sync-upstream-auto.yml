name: Auto Sync Upstream and Apply Patches

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target upstream tag to rebase patches onto (leave empty for latest release tag)'
        required: false
        default: ''
        type: string
      auto_merge_main:
        description: 'Automatically fast-forward / update main on clean sync'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-and-patch:
    name: Sync Upstream & Re-apply Patches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream Tags and Commits
        run: |
          git remote add upstream https://github.com/omnigent-ai/omnigent.git || true
          git fetch upstream --tags --force
          git fetch upstream main

      - name: Determine Target Release Tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="${INPUT_TAG}"
          else
            # Find latest official release tag (ignoring dev/rc unless explicitly targeted)
            TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Selected target upstream tag: ${TAG}"

      - name: Check if Already On Target Tag
        id: check_current
        run: |
          set -euo pipefail
          TARGET_TAG="${{ steps.target.outputs.tag }}"
          TARGET_COMMIT=$(git rev-parse "${TARGET_TAG}")
          if git merge-base --is-ancestor "${TARGET_COMMIT}" HEAD; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "main is already up to date with ${TARGET_TAG}"
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected: ${TARGET_TAG}"
          fi

      - name: Attempt Automatic Rebase / Cherry-Pick
        if: steps.check_current.outputs.already_synced == 'false'
        id: rebase
        run: |
          set -euo pipefail
          TARGET_TAG="${{ steps.target.outputs.tag }}"
          NEW_BRANCH="sync-${TARGET_TAG}"

          PREV_BASE=$(git merge-base "${TARGET_TAG}" main || git merge-base upstream/main main)
          echo "Previous common base: ${PREV_BASE}"

          COMMITS=$(git rev-list --reverse "${PREV_BASE}..main")
          echo "Custom commits to apply:"
          echo "${COMMITS}"

          git checkout -B "${NEW_BRANCH}" "${TARGET_TAG}"

          CONFLICT=false
          for commit in ${COMMITS}; do
            COMMIT_MSG=$(git log -1 --format="%s" "${commit}")
            echo "Applying ${commit}: ${COMMIT_MSG}"
            if ! git cherry-pick "${commit}"; then
              echo "Conflict encountered applying ${commit}"
              git cherry-pick --abort || true
              CONFLICT=true
              break
            fi
          done

          if [ "${CONFLICT}" = "false" ]; then
            # Ensure custom workflows are present
            git checkout main -- .github/workflows/ || true
            if [ -n "$(git status --porcelain .github/workflows/)" ]; then
              git add .github/workflows/
              git commit -m "ci: ensure custom workflows for ${TARGET_TAG}" || true
            fi
            git push origin "${NEW_BRANCH}" --force
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update main branch if auto_merge_main is true
        if: steps.check_current.outputs.already_synced == 'false' && steps.rebase.outputs.conflict == 'false' && (github.event.inputs.auto_merge_main != 'false')
        run: |
          set -euo pipefail
          TARGET_TAG="${{ steps.target.outputs.tag }}"
          NEW_BRANCH="sync-${TARGET_TAG}"
          echo "Fast-forwarding main to ${NEW_BRANCH}..."
          git checkout main
          git reset --hard "${NEW_BRANCH}"
          git push origin main --force

      - name: Open Pull Request on Clean Sync (if not fast-forwarded to main)
        if: steps.check_current.outputs.already_synced == 'false' && steps.rebase.outputs.conflict == 'false' && github.event.inputs.auto_merge_main == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_TAG="${{ steps.target.outputs.tag }}"
          NEW_BRANCH="sync-${TARGET_TAG}"
          gh pr create \
            --base main \
            --head "${NEW_BRANCH}" \
            --title "Automated Sync: Rebase custom patches onto ${TARGET_TAG}" \
            --body "Automated sync detected a new upstream release \`${TARGET_TAG}\`. All custom patches applied cleanly with 0 conflicts and branch \`${NEW_BRANCH}\` has been pushed." || true

      - name: Open Issue on Conflict
        if: steps.check_current.outputs.already_synced == 'false' && steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_TAG="${{ steps.target.outputs.tag }}"
          gh issue create \
            --title "⚠️ Upstream Sync Conflict with ${TARGET_TAG}" \
            --body "Automated sync attempted to rebase custom patches onto \`${TARGET_TAG}\`, but encountered merge/patch conflicts. Manual resolution is required."
